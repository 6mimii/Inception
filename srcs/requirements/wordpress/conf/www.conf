[www]
; Usuario y grupo que ejecutará el proceso
user = www-data
group = www-data

; Escuchar en el puerto 9000 para recibir peticiones de NGINX
; Usamos 0.0.0.0 para que acepte conexiones de cualquier IP dentro de la red de Docker
listen = 9000

; Configuración del gestor de procesos
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
